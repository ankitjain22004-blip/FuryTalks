kind = "web"
previewPath = "/"
title = "FuryTalks"
description = "The existing FuryTalks website, preserving its single-page design and original content while supporting validated WhatsApp click-to-chat forms and responsive contact links."
version = "1.0.0"
id = "artifacts/furytalks"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21397

[services.development]
run = "pnpm --filter @workspace/furytalks run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/furytalks", "run", "build" ]
serve = "static"
publicDir = "artifacts/furytalks/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21397"
BASE_PATH = "/"
